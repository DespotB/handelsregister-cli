[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "handelsregister-cli"
version = "0.1.0"
description = "Search the German commercial register (Handelsregister) and download all registry documents: Gesellschafterliste, Gesellschaftsvertrag, current/chronological printouts (AD/CD), structured XML (SI) and the full document folder (DK)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Despot Bitschnau" }]
keywords = [
  "handelsregister",
  "gesellschafterliste",
  "gesellschaftsvertrag",
  "handelsregisterauszug",
  "commercial-register",
  "germany",
  "registerportal",
  "company-data",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = [
  "mechanize>=0.4.8",
  "beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/DespotB/handelsregister-cli"
Issues = "https://github.com/DespotB/handelsregister-cli/issues"

[project.scripts]
hreg = "handelsregister_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
